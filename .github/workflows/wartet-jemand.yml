name: Wartet jemand

# Sagt dem Betreiber, dass eine Verifizierung wartet -- statt darauf zu hoffen,
# dass ihm einfaellt, ins Pruef-Postfach zu sehen.
#
# ANLASS (Founder am 20.09.2026): "Heisst wir entscheiden jede einzelne
# Angelegenheit und haben auch so viel Zeit?"
#
# ERWEITERT AM 21.09.2026 um Reklamationen und Inhalts-Meldungen. Beim
# Auszaehlen aller Tabellen, in denen etwas auf eine Entscheidung wartet,
# kam heraus, dass DREI davon niemand liest (disputes, inhalts_meldungen,
# chat_reports). Bei den Reklamationen haengt Geld daran: 0770 bricht die
# automatische Auszahlung mit `dispute_open` ab, eine offene Reklamation
# friert den Treuhandbetrag also ein. Bei den Inhalts-Meldungen haengt
# Art. 16 DSA daran.
#
# Der Stand beim Nachmessen war schlechter als die Frage: die Vorpruefung gibt
# es laengst (lib/pruefung.ts sortiert und sperrt), das Pruef-Postfach auch
# (app/pruefung.tsx, Edge Function `pruefung`), und `/health` zaehlt die
# offenen Faelle als `pruef_offen`. Nur SAGTE es niemand. In der Produktion
# wartete ein Betrieb, und der Mailversand ist aus -- er haette es nie erfahren,
# und der Betreiber auch nicht.
#
# WARUM EIN EIGENER WORKFLOW UND NICHT health.yml:
# Dessen Zeitplan ist bewusst ausgesetzt (06.08.2026), weil er taeglich einen
# ABSICHTSZUSTAND meldete -- fehlende Secrets, die so gewollt sind. Eine Mail
# ueber etwas, das man selbst so entschieden hat, traniert an, Alarme
# wegzuklicken. Dieser Lauf hat das Problem nicht: er ist STILL, solange
# niemand wartet, und er meldet einen Zustand, den man durch zwei Minuten
# Arbeit beendet. Genau das ist der Unterschied zwischen einem Alarm und
# einem Rauschen.
#
# WAS ER AUSDRUECKLICH NICHT TUT: entscheiden. Er gibt nichts frei, er lehnt
# nichts ab, er sieht kein einziges Dokument an. Die Entscheidung bleibt beim
# Menschen -- und die Sicherheitsgrenze (WERKANT_ADMIN_EMAILS) bleibt, wo sie
# ist. Automatisiert ist der HINWEIS, nicht das Urteil.

on:
  schedule:
    # 06:00 und 16:00 UTC = 08:00/18:00 im Sommer, 07:00/17:00 im Winter.
    - cron: '0 6,16 * * *'
  workflow_dispatch:

jobs:
  wartet-jemand:
    runs-on: ubuntu-latest
    steps:
      - name: Offene Verifizierungen zaehlen
        env:
          SECRET_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SECRET_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          # Gleiches Fallback-Muster wie health.yml: der publishable Key ist
          # RLS-safe und liegt ohnehin im oeffentlichen Web-Bundle.
          URL="${SECRET_URL:-https://chnphpmpdpllnpqtvwhx.supabase.co}"
          KEY="${SECRET_KEY:-sb_publishable_VT6KsxSQDBOYJYbc4qNcgQ_t_NRrh-U}"

          BODY=$(curl -s -w '\n%{http_code}' -H "apikey: $KEY" \
            "$URL/functions/v1/health")
          STATUS=$(echo "$BODY" | tail -n1)
          JSON=$(echo "$BODY" | sed '$d')
          echo "HTTP $STATUS"
          echo "$JSON"

          # BEWUSST unabhaengig vom Status-Code: /health antwortet 503, solange
          # die Betriebs-Secrets absichtlich fehlen. Wer hier auf 200 bestuende,
          # haette einen Waechter, der genau so lange schweigt, wie der
          # Absichtszustand anhaelt -- also immer.
          if [ "$STATUS" = "404" ]; then
            echo "::error::health-Function ist nicht deployt. Dieser Waechter kann nichts sehen."
            exit 1
          fi

          zahl() { echo "$JSON" | grep -o "\"$1\":[0-9]*" | head -n1 | cut -d: -f2; }
          flagge() { echo "$JSON" | grep -o "\"$1\":[a-z]*" | head -n1 | cut -d: -f2; }

          OFFEN=$(zahl pruef_offen)
          STAU=$(flagge pruef_stau)
          REK=$(zahl reklamationen_offen)
          REK_STAU=$(flagge reklamationen_stau)
          MELD=$(zahl meldungen_offen)
          MELD_STAU=$(flagge meldungen_stau)

          # Die Frist kann verstrichen sein, dann ist die Zahl negativ --
          # `zahl` liest nur Ziffern und wuerde daraus still eine falsche
          # positive Zahl machen.
          zahlS() { echo "$JSON" | grep -o "\"$1\":-\?[0-9]*" | head -n1 | cut -d: -f2; }
          PSTG_LAUF=$(flagge pstg_lauf_fehlt)
          PSTG_ABGABE=$(flagge pstg_abgabe_fehlt)
          PSTG_TAGE=$(zahlS pstg_tage_bis_frist)

          # Fehlt das Feld, ist der Waechter blind -- und ein blinder Waechter,
          # der gruen meldet, ist schlimmer als keiner. Dieselbe Klasse wie der
          # 404-Fall in health.yml, der bis zum 27.07. still gruen war.
          for feld in OFFEN REK MELD PSTG_LAUF PSTG_ABGABE PSTG_TAGE; do
            eval "wert=\$$feld"
            if [ -z "$wert" ]; then
              echo "::error::/health nennt nicht mehr alle Warteschlangen (fehlt bei $feld). Feld umbenannt oder Function alt?"
              exit 1
            fi
          done

          echo "Verifizierungen: $OFFEN (Stau: ${STAU:-?}) · Reklamationen: $REK (Stau: ${REK_STAU:-?}) · Meldungen: $MELD (Stau: ${MELD_STAU:-?})"

          WARTET=0
          if [ "$OFFEN" -gt 0 ]; then
            WARTET=1
            if [ "$STAU" = "true" ]; then
              echo "::error::$OFFEN Verifizierung(en) offen, davon mindestens eine seit ueber 24 Stunden. Ein Betrieb, der so lange wartet, ist meist schon weg. Pruef-Postfach: /pruefung"
            else
              echo "::error::$OFFEN Verifizierung(en) warten auf eine Entscheidung. Pruef-Postfach: /pruefung"
            fi
          fi
          if [ "$REK" -gt 0 ]; then
            WARTET=1
            if [ "$REK_STAU" = "true" ]; then
              echo "::error::$REK Reklamation(en) offen, davon mindestens eine laenger als die zugesagten 2 Werktage. Solange sie offen ist, ist der Treuhandbetrag eingefroren (0770) -- fuer BEIDE Seiten."
            else
              echo "::error::$REK Reklamation(en) offen. Solange sie offen sind, ist der jeweilige Treuhandbetrag eingefroren (0770)."
            fi
          fi
          if [ "$MELD" -gt 0 ]; then
            WARTET=1
            if [ "$MELD_STAU" = "true" ]; then
              echo "::error::$MELD Inhalts-Meldung(en) unentschieden, davon mindestens eine seit ueber 24 Stunden. Art. 16 DSA verlangt eine sorgfaeltige und zuegige Bearbeitung."
            else
              echo "::error::$MELD Inhalts-Meldung(en) warten auf eine Entscheidung (Art. 16 DSA)."
            fi
          fi

          # DAC7-Jahresmeldung (1010). Anders als die drei Warteschlangen ist
          # das keine Frage der Reaktionszeit, sondern eine gesetzliche Frist:
          # bis 31. Januar fuer das Vorjahr (§ 13 PStTG), Bussgeld bis
          # 50.000 EUR bei Versaeumnis (§ 25 PStTG).
          #
          # Zwei getrennte Zustaende, und beide muessen einzeln anschlagen:
          # „nichts vorbereitet" und „vorbereitet, aber nie ans BZSt gegangen".
          if [ "$PSTG_TAGE" -lt 0 ]; then
            FRIST="Frist seit $(( -PSTG_TAGE )) Tag(en) VERSTRICHEN"
          else
            FRIST="noch $PSTG_TAGE Tag(e) bis zum 31. Januar"
          fi
          if [ "$PSTG_LAUF" = "true" ]; then
            WARTET=1
            echo "::error::DAC7-Jahresmeldung: nichts vorbereitet ($FRIST). pstg-annual-report wurde fuer das Vorjahr nie aufgerufen -- die Function laeuft NICHT von selbst. § 13 PStTG."
          fi
          if [ "$PSTG_ABGABE" = "true" ]; then
            WARTET=1
            echo "::error::DAC7-Jahresmeldung: vorbereitet, aber nicht abgegeben ($FRIST). Die Zeilen stehen in pstg_reports, submitted_at ist leer -- die XML-Meldung ging nie ans BZSt. § 13 PStTG, Bussgeld nach § 25."
          fi

          if [ "$WARTET" -eq 1 ]; then exit 1; fi

          echo "Niemand wartet."
