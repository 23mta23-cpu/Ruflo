name: Browser-Reisen

# Die dreizehn Kern-Reisen und die Bildschirm-Pruefer liefen bis zum
# 18.09.2026 NIRGENDS automatisch -- nur von Hand.
#
# Genau diese Lehre steht seit dem 08.09. im Kopf von `scripts/ton-check.py`:
# „Ein Pruefer, der nur von Hand mit einem Dateipfad laeuft, laeuft nie."
# Dort war es ein Skript, hier sind es dreizehn Reisen, die unter anderem
# belegen, dass
#
#   * die Kalender-Knoepfe nach dem Alert-Fix wirklich etwas tun (Reise 9),
#   * der gesetzliche Widerrufsweg nicht mehr stumm scheitert (Reise 8),
#   * Pflichtmitteilungen den Betrieb erreichen (Reise 10),
#   * die Kaltstart-Mitteilung den Kunden erreicht (Reise 11),
#   * die Start-PIN wirkt und der Termin ohne sie hinausgeht (Reise 12),
#   * die Anfragen-Liste sortiert und nichts wegwirft (Reise 13).
#
# WARUM NICHT IN ci.yml: der vollstaendige Lauf dauert gemessen rund 40
# Minuten (allein `alle-screens-check` 14, `knopf-fehler-check` 10). `ci.yml`
# ist bewusst auf 2-3 Minuten schnelles Feedback ausgelegt, und ein CI, auf
# das man eine Dreiviertelstunde wartet, wird umgangen. Deshalb ein eigener
# Lauf: naechtlich, und jederzeit von Hand ausloesbar.

# WICHTIG, damit niemand sich darauf verlaesst: solange diese Datei auf einem
# Arbeitszweig liegt, laeuft der Zeitplan NICHT. GitHub startet
# `schedule`-Ausloeser ausschliesslich von der Fassung auf dem Standardzweig.
# Naechtlich laeuft die Suite also erst nach dem Merge nach `main` -- und der
# erste Lauf dort ist zugleich die Probe, ob sie auf einem GitHub-Laeufer
# ueberhaupt gruen wird. Von hier aus laesst sich das nicht pruefen.
on:
  schedule:
    # 03:17 UTC. Krumme Minute mit Absicht: zur vollen Stunde stehen die
    # GitHub-Laeufer Schlange.
    - cron: '17 3 * * *'
  workflow_dispatch:

# Mehrere Laeufe gleichzeitig bringen nichts und kosten Minuten.
concurrency:
  group: browser-reisen
  cancel-in-progress: true

jobs:
  reisen:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Abhaengigkeiten
        run: npm ci --no-audit --no-fund

      # Der Pruefstand laeuft ohne Netz zur Produktion: jede Anfrage an
      # Supabase wird abgefangen (scripts/lib/anbieter-sitzung.cjs). Die
      # Schluessel duerfen trotzdem gesetzt sein, sonst baut der Export anders
      # als in der Produktion.
      - name: Chromium holen
        run: npx playwright install --with-deps chromium

      # Die Reise-Skripte erwarten den Pfad in CHROME_PFAD; die Vorgabe darin
      # ist der Pfad DIESER Sandbox und existiert auf einem GitHub-Laeufer
      # nicht. Deshalb hier den echten Pfad nachschlagen, statt ihn zu raten.
      - name: Pfad zu Chromium bestimmen
        run: |
          echo "CHROME_PFAD=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"

      - name: Alle Reisen und Bildschirm-Pruefer
        run: bash scripts/reisen/run.sh
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || '' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || '' }}
