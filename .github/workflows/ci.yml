# CI: Typecheck + Tests bei jedem PR und Push — fängt Regressionen, bevor sie
# in main landen. Bewusst schlank (kein expo export: das macht der Pages-Deploy
# in static.yml selbst; hier zählt schnelles Feedback in ~2-3 Min).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'claude/**']

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npx jest --silent

  # Edge Functions (Deno) typechecken — npx tsc deckt supabase/functions/ NICHT
  # ab, die Functions deployen aber bei jedem Push direkt in Produktion. Ein
  # Typfehler würde sonst erst zur Laufzeit auffallen (z. B. fehlgeschlagene
  # Zahlung). deno check fängt ihn vor dem Merge.
  edge-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        run: |
          # --node-modules-dir=auto: die Stripe-Lib referenziert npm:@types/node;
          # ohne den Flag scheitert deno check in sauberer CI an der Auflösung.
          # esm.sh liefert sporadisch 522 (CDN-Flake, 20.07.) — pro Function
          # bis zu 3 Versuche mit Pause, bevor der Job wirklich rot wird.
          rc=0
          for fn in supabase/functions/*/index.ts; do
            echo "== deno check $fn =="
            ok=0
            for attempt in 1 2 3; do
              if deno check --node-modules-dir=auto "$fn"; then ok=1; break; fi
              echo "-- Versuch $attempt fehlgeschlagen (CDN?), warte 15s --"
              sleep 15
            done
            [ "$ok" = "1" ] || rc=1
          done
          exit $rc

      # Ein Knopf, der auf eine Route zeigt, die es nicht gibt, ist fuer den
      # Nutzer nicht von einem Absturz zu unterscheiden -- und kein Typ-Check
      # merkt es, weil Routen Zeichenketten sind. Aufgefallen am 15.08.2026:
      # die PStTG-Schwellen-Benachrichtigung schickte seit jeher auf
      # "/(provider)/steuer", eine Route, die es NIE gab.
      - name: Tote Navigationsziele
        run: python3 scripts/tote-links-check.py

      # Der Kundenbereich siezte, der Anbieterbereich mischte — am selben Feld
      # auf zwei benachbarten Screens einmal "Beschreiben Sie Ihre Leistungen"
      # und einmal "Beschreibe deine Dienstleistungen". Wer beim Wechsel
      # ploetzlich anders angesprochen wird, merkt das, und es liest sich
      # unfertig. Umkehrbar: ERWARTET_SIE im Skript.
      - name: Einheitliche Anrede
        run: python3 scripts/anrede-check.py

      # Am 16.08.2026 verwies die App an 16 Stellen auf sechs verschiedene
      # Postfaecher — von denen KEINES existierte. Wer dem Impressum
      # (§5 Abs. 1 Nr. 2 DDG), der Datenschutzerklaerung (Art. 13 DSGVO) oder
      # der Widerrufsbelehrung (Art. 246a §1 Abs. 2 EGBGB) folgte, schrieb ins
      # Leere. Seitdem stehen alle Adressen in constants/legal.ts, und ein
      # Schalter dort lenkt sie auf EIN Postfach, solange es nur eines gibt.
      # Das haelt aber nur, solange niemand wieder eine Adresse direkt in
      # einen Bildschirm schreibt.
      - name: Postfaecher zentral
        run: python3 scripts/postfach-check.py

      # Am 16.08.2026 sind an EINEM Tag zwei Widersprueche zwischen AGB und
      # Code aufgefallen — beide nicht durch einen Test, sondern durch
      # Nachfragen des Founders: §7(3) sagt "3 Strikes innerhalb von 12
      # Monaten", der Code zaehlte ohne Datumsgrenze; §2(4) legt die
      # Suchreihenfolge offen (Art. 5 P2B-VO), die Suche sortierte gar nicht.
      # Eine AGB-Zusage ist eine pruefbare Aussage, keine Prosa.
      - name: AGB-Zusagen gegen den Code
        run: python3 scripts/agb-code-check.py

      # Die haeufigste Klasse von Founder-Befunden in diesem Projekt ist nicht
      # "etwas ist falsch", sondern "ich tippe darauf und es passiert nichts".
      # Allein am 16.08.2026: Umkreis-Filter, Kalender-Umschaltung, Sync-Knopf,
      # Angebotskarte im Chat, "Foto aendern", "Fotos hinzufuegen". Ein
      # Element, das aussieht wie eine Funktion und keine ist, ist schlimmer
      # als ein fehlendes — der Nutzer haelt die ganze App fuer kaputt.
      # Ehrliche Sackgassen ("ist noch nicht freigeschaltet") sind erlaubt:
      # sie haben einen Handler und sagen die Wahrheit.
      - name: Keine toten Bedienelemente
        run: python3 scripts/tote-knoepfe-check.py

      # Ein Knopf, der nur ein Symbol zeigt, meldet einer Vorlesefunktion
      # "Schaltflaeche" und sonst nichts. Wer die App nicht sehen kann, weiss
      # nicht, ob er teilt, loescht oder abbricht. BFSG gilt seit 28.06.2025
      # fuer E-Commerce-Dienste; WCAG 4.1.2 (Name, Rolle, Wert).
      - name: Symbol-Knoepfe haben eine Beschriftung
        run: python3 scripts/a11y-symbolknoepfe-check.py

      # Die Edge-Function-Logik wurde bis PR #159 NIE ausgefuehrt — CI pruefte
      # sie nur mit `deno check`. Typpruefung ist kein Test. Dieser Schritt
      # fuehrt die Handlerlogik des Stripe-Webhooks tatsaechlich aus.
      #
      # Absichtlich streng, weil ein Testlauf, der nichts prueft und trotzdem
      # gruen meldet, schlimmer ist als kein Test (siehe scripts/db-test/run.sh,
      # gleiche Fehlerklasse):
      #   - EXPLIZITER Dateipfad statt Verzeichnis: verschwindet die Datei,
      #     bricht deno test ab, statt still "0 Tests" zu melden.
      #   - KEIN --allow-none: ein leerer Lauf ist ein Fehler.
      #   - Mindest-Testanzahl wird geprueft, nicht nur gedruckt.
      - name: Edge-Function-Tests ausfuehren
        run: |
          # Jede Datei EXPLIZIT mit EIGENER Mindestzahl. Eine Gesamtsumme
          # wuerde einen Rueckgang in einer Datei verbergen, solange eine
          # andere waechst -- genau die Klasse "Assertion verschwindet still",
          # gegen die scripts/db-test/run.sh schon gehaertet ist.
          TESTS="supabase/tests/stripe-webhook_test.ts:50 supabase/tests/release-escrow_test.ts:48 supabase/tests/cancel-contract_test.ts:38 supabase/tests/create-payment-intent_test.ts:15"

          rc_gesamt=0
          for eintrag in $TESTS; do
            DATEI="${eintrag%:*}"
            MINDESTENS="${eintrag##*:}"

            if [ ! -f "$DATEI" ]; then
              echo "::error::$DATEI fehlt — diese Tests wuerden stillschweigend entfallen."
              exit 1
            fi

            # esm.sh liefert sporadisch 522 (CDN-Flake) — wie im Schritt oben bis
            # zu 3 Versuche. Ein Remote-Import-Fehler gilt NICHT als Erfolg: nach
            # dem letzten Versuch bleibt der Job rot. Ein echter Testfehler
            # bricht die Schleife sofort ab, statt dreimal zu laufen.
            rc=1
            for attempt in 1 2 3; do
              deno test --node-modules-dir=auto --allow-net --allow-read --allow-env "$DATEI" > /tmp/deno-test.log 2>&1 && { rc=0; break; }
              rc=1
              if grep -qE "error sending request|Import .* failed|522|Connection refused" /tmp/deno-test.log; then
                echo "-- $DATEI Versuch $attempt: Remote-Import fehlgeschlagen (CDN?), warte 15s --"
                sleep 15
              else
                break
              fi
            done

            cat /tmp/deno-test.log
            if [ "$rc" != "0" ]; then
              echo "::error::$DATEI rot."
              rc_gesamt=1
              continue
            fi

            ANZAHL=$(grep -oE "[0-9]+ passed" /tmp/deno-test.log | head -1 | grep -oE "[0-9]+")
            echo "$DATEI: ${ANZAHL:-0} Tests (erwartet mindestens $MINDESTENS)"
            if [ -z "$ANZAHL" ] || [ "$ANZAHL" -lt "$MINDESTENS" ]; then
              echo "::error::$DATEI: erwartet mindestens $MINDESTENS Tests, gelaufen ${ANZAHL:-0}. Ist eine Assertion verschwunden?"
              rc_gesamt=1
            fi
          done
          exit $rc_gesamt  # Eine Function, die nicht in config.toml deklariert ist, wird von der
      # Supabase-GitHub-Integration NIE deployt — sie liegt sauber getypt im
      # Repo und antwortet live 404. Genau das ist mit `health` aus PR #144
      # passiert: deno check gruen, Function nie ausgefuehrt. Der Typecheck
      # oben kann das prinzipiell nicht sehen, deshalb dieser Guard.
      - name: Jede Edge Function muss in config.toml deklariert sein
        run: |
          rc=0
          for d in supabase/functions/*/; do
            n=$(basename "$d")
            [ "$n" = "_shared" ] && continue
            if ! grep -q "^\[functions\.$n\]" supabase/config.toml; then
              echo "::error file=supabase/config.toml::Function '$n' fehlt in supabase/config.toml — sie wuerde nie deployt werden."
              rc=1
            fi
          done
          [ "$rc" = "0" ] && echo "Alle Edge Functions sind deklariert."
          exit $rc

  # DB-Integrationstest: replayt alle Migrationen + prüft Geld-Kern, RLS-Isolation
  # und E-Mail-Gate gegen ein echtes Postgres (scripts/db-test/run.sh im TCP-Modus).
  db-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Ensure psql client
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: DB integration tests
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/db-test/run.sh
