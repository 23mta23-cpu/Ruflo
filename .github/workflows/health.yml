name: Betriebs-Health

# Erkennt fehlende Betriebs-Secrets, BEVOR ein Nutzer darauf läuft.
#
# Anlass: Ein fehlender RESEND_API_KEY hat die App unbemerkt für jedes nicht
# manuell freigeschaltete Konto funktionslos gemacht — kein Verifikations-Mail,
# kein DOI-Stempel, alle Schreibwege per RLS gesperrt. Es gab keine Stelle, an
# der das auffiel, bis ein Mensch es gemeldet hat.
# Siehe docs/ops/RESEND-MAIL-GATE.md.
#
# Schlägt dieser Job fehl, schickt GitHub dem Repo-Owner automatisch eine Mail.
# Das ist der eigentliche Detektor — nicht die Dokumentation.

# ZEITPLAN AUSGESETZT (Founder-Entscheidung 06.08.2026).
#
# Der Check lief 2x täglich und schlug seit dem 27.07. bei JEDEM Lauf fehl —
# völlig zu Recht: RESEND_API_KEY, WAITLIST_FROM_EMAIL, STRIPE_SECRET_KEY und
# STRIPE_WEBHOOK_SECRET sind bewusst nicht gesetzt. Der Detektor meldete also
# korrekt einen ABSICHTSZUSTAND.
#
# Genau das macht ihn hier schädlich: eine tägliche Mail über etwas, das man
# selbst so entschieden hat, trainiert an, Alarme wegzuklicken. Damit wäre der
# Zweck dieses Workflows verloren — er wurde gebaut, WEIL ein stiller Ausfall
# monatelang unbemerkt blieb.
#
# WIEDER SCHARF SCHALTEN, sobald die Secrets gesetzt sind: die beiden
# `schedule`-Zeilen unten einkommentieren. Bis dahin bleibt der Lauf von Hand
# über „Run workflow" möglich — die Prüflogik ist unverändert.
on:
  # schedule:
  #   - cron: '0 6,18 * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Health-Endpoint prüfen
        env:
          SECRET_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SECRET_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          # Gleiches Fallback-Muster wie supabase-keep-alive.yml: Repo-Secrets
          # sind nicht gesetzt, der publishable Key ist RLS-safe und liegt
          # ohnehin im öffentlichen Web-Bundle.
          URL="${SECRET_URL:-https://chnphpmpdpllnpqtvwhx.supabase.co}"
          KEY="${SECRET_KEY:-sb_publishable_VT6KsxSQDBOYJYbc4qNcgQ_t_NRrh-U}"

          BODY=$(curl -s -w '\n%{http_code}' -H "apikey: $KEY" \
            "$URL/functions/v1/health")
          STATUS=$(echo "$BODY" | tail -n1)
          JSON=$(echo "$BODY" | sed '$d')
          echo "HTTP $STATUS"
          echo "$JSON"

          # 404 ist KEIN harmloser Zustand: Genau so war der Check von PR #144
          # bis 27.07. still gruen, ohne je etwas zu pruefen — dieselbe Klasse
          # von unbemerktem Ausfall, gegen die er gebaut wurde. Eine nicht
          # deploybare Function muss auffallen.
          if [ "$STATUS" = "404" ]; then
            echo "::error::health-Function ist nicht deployt. Steht sie in supabase/config.toml? Siehe docs/ops/RESEND-MAIL-GATE.md"
            exit 1
          fi

          # 503 = kritisches Secret fehlt (der Endpoint setzt den Code selbst).
          if [ "$STATUS" != "200" ]; then
            echo "::error::Health-Check rot (HTTP $STATUS). Betriebs-Secrets prüfen — siehe docs/ops/RESEND-MAIL-GATE.md"
            exit 1
          fi

          # Zusätzlich explizit auf den Mail-Versand prüfen: ohne ihn ist jede
          # Registrierung eine Sackgasse.
          echo "$JSON" | grep -q '"mail":true' || {
            echo "::error::RESEND_API_KEY fehlt — Verifizierung und Anbieter-Benachrichtigungen sind tot. docs/ops/RESEND-MAIL-GATE.md"
            exit 1
          }
          echo "Health OK."
